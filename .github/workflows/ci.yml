# Offline test suite.
# No secrets, no live runs: the suite is offline. Tests that need Playwright's Chromium skip (2 expected).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install requirements.txt only
        run: python -m pip install -r requirements.txt
      - name: Run the offline suite
        run: python -m pytest -q -p no:cacheprovider
